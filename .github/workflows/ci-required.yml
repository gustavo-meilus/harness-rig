name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  ordinary:
    name: ci / ordinary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run ordinary tests
        run: PYTHONPATH=prototype python -m unittest discover -s prototype/tests -p 'test_*.py' -v

  kb_integrity:
    name: ci / kb-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Audit canonical knowledge
        run: python verification/context_kb.py audit .

  required:
    name: ci / required
    needs: [ordinary, kb_integrity]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check mandatory jobs
        env:
          ORDINARY_RESULT: ${{ needs.ordinary.result }}
          KB_RESULT: ${{ needs.kb_integrity.result }}
        run: |
          test "$ORDINARY_RESULT" = success
          test "$KB_RESULT" = success
